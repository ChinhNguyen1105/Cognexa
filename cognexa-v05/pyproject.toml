[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognexa"
version = "0.5.0"
description = "Transformer-based document intelligence system"
requires-python = ">=3.12,<3.13"

dependencies = [
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]