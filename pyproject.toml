[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognexa"
version = "0.4.0"
description = "Cognexa - Neural Document Intelligence"
requires-python = ">=3.12,<3.13"

dependencies = [
    "typer",
    "scikit-learn",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
cognexa = "cognexa.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]