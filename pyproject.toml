[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognexa"
version = "0.6.0"
description = "LLM-based assistant for text generation"
requires-python = ">=3.12,<3.13"

dependencies = [
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cognexa = "cognexa.cli.main:main"