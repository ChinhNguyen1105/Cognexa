[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognexa"
version = "0.1.0"
description = "Cognexa - Document Processing Intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
cognexa = "cognexa.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]